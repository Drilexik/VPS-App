name: drilex_vps
description: Drilex VPS Manager – Control your Ubuntu server from anywhere
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  animations: ^2.0.11
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
